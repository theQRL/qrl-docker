# One job per architecture, each on a native runner, joined into a single
# manifest at the end.
#
# The previous config built arm64 under QEMU on an x86 runner. That took 20-30
# minutes for the vendored C++ extensions and was dropped, which left every
# published tag amd64-only - so an arm64 user pulling the image got
# "illegal instruction" from pyqryptonight rather than a working node, or a
# clean error. Building on a native Arm runner fixes that, and is faster than
# the emulated build it replaces.
#
# Users still pull one tag: `docker pull qrledger/qrl-docker:noble` resolves to
# the right architecture via the manifest. The per-architecture tags exist only
# as build artefacts.
#
# Requires DOCKERHUB_USERNAME and DOCKERHUB_TOKEN with pull AND push rights -
# push-only fails, because every build resolves `FROM ubuntu:...` while
# authenticated.
version: 2.1

parameters:
  latest_branch:
    type: string
    default: "noble"

jobs:
  build:
    parameters:
      arch:
        type: string
      resource:
        type: string
    machine:
      image: ubuntu-2204:current
    resource_class: << parameters.resource >>
    environment:
      ARCH: << parameters.arch >>
    steps:
      - checkout
      - run:
          name: Build (native << parameters.arch >>)
          command: |
            # Native build: no --platform, no emulation. The runner's own
            # architecture is what we are producing.
            docker build -t "qrledger/qrl-docker:${CIRCLE_BRANCH}-${ARCH}" .
            echo "built ${CIRCLE_BRANCH}-${ARCH} on $(uname -m)"
      - run:
          name: Smoke test
          command: |
            IMG="qrledger/qrl-docker:${CIRCLE_BRANCH}-${ARCH}"

            # 1. Package data must have survived the wheel build - a node that
            #    cannot find genesis.yml exits at start.
            docker run --rm --entrypoint python3 "$IMG" -c \
              "import qrl, os; \
               p = os.path.join(os.path.dirname(qrl.__file__), 'core', 'genesis.yml'); \
               assert os.path.exists(p), p; print('genesis.yml OK')"

            # 2. A green build is NOT enough. Start the node: a missing
            #    /etc/services once produced an image that built perfectly and
            #    then died with "Could not contact NTP servers after 6 retries".
            docker volume create ci-smoke > /dev/null
            docker run -d --name ci-smoke -v ci-smoke:/home/qrl/.qrl "$IMG" > /dev/null
            ok=0
            for _ in $(seq 1 40); do
              if docker exec --user qrl ci-smoke qrl state > /dev/null 2>&1; then ok=1; break; fi
              if [ "$(docker inspect -f '{{.State.Running}}' ci-smoke)" = "false" ]; then break; fi
              sleep 5
            done
            if [ "$ok" != "1" ]; then
              echo "node did not come up on ${ARCH}:"; docker logs ci-smoke | tail -40; exit 1
            fi

            # 3. The wallet must land inside the volume. Upstream defaults
            #    --wallet_dir to '.', which would put it in the container layer
            #    where docker rm destroys it; the image sets ENV_QRL_WALLET_DIR.
            wp=$(docker exec --user qrl ci-smoke qrl wallet_gen \
                 | sed -n 's/^Wallet at *: *//p' | tr -d '\r')
            [ "$wp" = "/home/qrl/.qrl/wallet.json" ] || {
              echo "wallet escaped the volume: '$wp'"; exit 1; }
            docker run --rm -v ci-smoke:/d:ro alpine test -f /d/wallet.json

            docker rm -f ci-smoke > /dev/null; docker volume rm -f ci-smoke > /dev/null
            echo "smoke test OK on ${ARCH}"
      - run:
          name: Push the per-architecture tag
          command: |
            # Published only from theQRL. A fork builds and smoke tests exactly
            # the same way, then stops - so a fork goes green with no
            # credentials, and cannot publish to qrledger/ even if some are set.
            if [ "$CIRCLE_PROJECT_USERNAME" != "theQRL" ]; then
              echo "Project is ${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}, not theQRL."
              echo "Build and smoke test passed; skipping publish."
              exit 0
            fi
            if [ -z "${DOCKERHUB_USERNAME:-}" ] || [ -z "${DOCKERHUB_TOKEN:-}" ]; then
              echo "DOCKERHUB_USERNAME and DOCKERHUB_TOKEN must be set on this project."
              exit 1
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
            docker push "qrledger/qrl-docker:${CIRCLE_BRANCH}-${ARCH}"

  manifest:
    docker:
      - image: cimg/base:current
    steps:
      - setup_remote_docker
      - run:
          name: Join the per-architecture tags into one manifest
          command: |
            if [ "$CIRCLE_PROJECT_USERNAME" != "theQRL" ]; then
              echo "Not theQRL; nothing was published, so there is no manifest to build."
              exit 0
            fi
            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            REPO=qrledger/qrl-docker
            SRC="${REPO}:${CIRCLE_BRANCH}-amd64 ${REPO}:${CIRCLE_BRANCH}-arm64"

            # One tag, both architectures: `docker pull` then resolves to the
            # right image instead of handing an arm64 host an x86 binary.
            docker buildx imagetools create -t "${REPO}:${CIRCLE_BRANCH}" $SRC
            if [ "$CIRCLE_BRANCH" = "<< pipeline.parameters.latest_branch >>" ]; then
              docker buildx imagetools create -t "${REPO}:latest" $SRC
            fi

            echo "--- published manifest ---"
            docker buildx imagetools inspect "${REPO}:${CIRCLE_BRANCH}"

workflows:
  commit:
    jobs:
      - build:
          name: build_amd64
          arch: amd64
          resource: medium
          filters: {branches: {ignore: [master, gh-pages]}}
      - build:
          name: build_arm64
          arch: arm64
          resource: arm.medium
          filters: {branches: {ignore: [master, gh-pages]}}
      - manifest:
          requires: [build_amd64, build_arm64]
          filters: {branches: {ignore: [master, gh-pages]}}
  weekly:
    triggers:
      - schedule:
          cron: "0 3 * * 1"
          filters: {branches: {only: [<< pipeline.parameters.latest_branch >>]}}
    jobs:
      - build:
          name: build_amd64
          arch: amd64
          resource: medium
      - build:
          name: build_arm64
          arch: arm64
          resource: arm.medium
      - manifest:
          requires: [build_amd64, build_arm64]
